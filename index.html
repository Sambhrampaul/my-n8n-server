
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Assistant</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #f4f7f6; }
    </style>
    <!-- Official n8n Chat Widget Library -->
    <link href="https://jsdelivr.net" rel="stylesheet" />
</head>
<body>

    <script type="module">
        import { createChat } from 'https://jsdelivr.net';

        createChat({
            webhookUrl: 'https://ngrok-free.dev',
            mode: 'fullscreen',
            showWelcomeScreen: true,
            title: 'Water Quality Assistant',
            subtitle: 'Ask me anything about water parameters',
            initialMessages: [
                'Hello! I am your friendly Water Quality Check Assistant. How can I help you determine if your water source is safe today?'
            ]
        });
    </script>
</body>
</html>
